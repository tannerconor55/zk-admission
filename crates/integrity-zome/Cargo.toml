[package]
name = "zk-admission-integrity-zome"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hdi = { workspace = true }
holo_hash = { workspace = true, features = ["hashing"] }
holochain_serialized_bytes = { workspace = true }
serde = { workspace = true }
sp1-verifier = { version = "6.8.1", default-features = false }
hex = "0.4.3"
zk-admission-protocol = { path = "../protocol" }
zk-admission-groth16-verifier = { path = "../groth16-verifier" }

[dev-dependencies]
# Arkworks-only; lets tests generate real native proofs without the SP1
# prover crate. Not a normal dependency: the zome never proves.
zk-admission-groth16-circuit = { path = "../groth16-circuit" }
