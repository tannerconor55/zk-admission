[workspace]
resolver = "2"

members = [
    "crates/protocol",
    "crates/integrity-zome",
    "crates/sp1-guest",
    "crates/prover",
    "crates/groth16-verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
thiserror = "2.0"
hdi = "=0.8.0"
hdk = "=0.7.0"
holo_hash = "=0.7.0"
holochain_serialized_bytes = "=0.0.57"
